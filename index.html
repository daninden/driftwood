<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driftwood</title>
<style>
  html, body { height: 100%; margin: 0; touch-action: none; }
  body { overflow: hidden; background: linear-gradient(#efe0c2, #cdb48c); color-scheme: light; }
  #island { position: fixed; inset: 0; }
  #island canvas { display: block; width: 100%; height: 100%; touch-action: none; opacity: 0; transition: opacity 1.2s ease; }
  body.ready #island canvas { opacity: 1; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #2e2418; font-family: Georgia, 'Times New Roman', serif; transition: opacity 0.8s ease; pointer-events: none; }
  #loader .name { font-size: 44px; letter-spacing: 0.12em; }
  #loader .bar { width: 200px; height: 4px; border: 1px solid rgba(46, 36, 24, 0.45); border-radius: 3px; overflow: hidden; }
  #loader .fill { height: 100%; background: #2e2418; transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease-out; }
  body.ready #loader { opacity: 0; }
  #rest { position: fixed; left: calc(18px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 26px; height: 26px; pointer-events: none; visibility: hidden; transition: opacity 1.5s ease; }
  body.ready #rest { visibility: visible; }
  #rest .rim { fill: none; stroke: #2e2418; stroke-opacity: 0.5; stroke-width: 1; }
  #rest .lit { fill: #2e2418; }
  #stick { position: fixed; right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); width: 150px; height: 150px; display: none; opacity: 0.3; transition: opacity 0.5s ease; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; visibility: hidden; }
  @media (pointer: coarse) and (not (any-pointer: fine)) { #stick { display: block; } }
  body.ready #stick { visibility: visible; }
  #stick.active { opacity: 0.75; transition-duration: 0.15s; }
  #stick svg { width: 100%; height: 100%; display: block; pointer-events: none; overflow: visible; }
  #stick .ring { fill: none; stroke: #2e2418; stroke-width: 1.3; }
  #stick .knob { fill: #2e2418; transition: transform 0.18s ease-out; }
  #stick .knob.held { transition: none; }
  #carry { position: fixed; left: calc(18px + 26px + 14px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); height: 26px; display: flex; align-items: flex-end; gap: 2px; opacity: 0.3; pointer-events: none; visibility: hidden; transition: opacity 0.5s ease; }
  body.ready #carry { visibility: visible; }
  #carry svg { height: 24px; width: auto; fill: none; stroke: #2e2418; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  #dev { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); color: #2e2418; opacity: 0.75; padding: 2px 7px; border-radius: 9px; background: rgba(239, 224, 194, 0.4); font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.02em; white-space: nowrap; pointer-events: none; user-select: none; visibility: hidden; }
  #dev[hidden] { display: none; }
  body.ready #dev { visibility: visible; }
</style>
</head>
<body>
<div id="island"></div>
<svg id="rest" viewBox="-1 -1 26 26" aria-hidden="true"><circle class="rim" cx="12" cy="12" r="12"/><path class="lit"/></svg>
<div id="stick" aria-hidden="true"><svg viewBox="-75 -75 150 150"><circle class="ring" cx="0" cy="0" r="55"/><circle class="knob" cx="0" cy="0" r="6"/></svg></div>
<div id="carry" aria-hidden="true"></div>
<div id="dev" aria-hidden="true"></div>
<div id="loader"><div class="name">DRIFTWOOD</div><div class="bar"><div class="fill"></div></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
