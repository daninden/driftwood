<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driftwood</title>
<style>
  :root { --ink: #2e2418; --ink-back: rgba(239, 224, 194, 0.4); --ink-glow: rgba(239, 224, 194, 0.85); --halo: drop-shadow(0 0 1.5px var(--ink-glow)) drop-shadow(0 0 4px var(--ink-glow)); }   /* the ink of the marks; render/ink turns it pale at night */
  html, body { height: 100%; margin: 0; touch-action: none; }
  body { overflow: hidden; background: linear-gradient(#efe0c2, #cdb48c); color-scheme: light; }
  #island { position: fixed; inset: 0; }
  #island canvas { display: block; width: 100%; height: 100%; touch-action: none; opacity: 0; transition: opacity 1.2s ease; }
  body.ready #island canvas { opacity: 1; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #2e2418; font-family: Georgia, 'Times New Roman', serif; transition: opacity 0.8s ease; pointer-events: none; }
  #loader .name { font-size: 44px; letter-spacing: 0.12em; }
  #loader .bar { width: 200px; height: 4px; border: 1px solid rgba(46, 36, 24, 0.45); border-radius: 3px; overflow: hidden; }
  #loader .fill { height: 100%; background: #2e2418; transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease-out; }
  #loader .ask { display: flex; flex-direction: column; align-items: center; gap: 6px; transition: opacity 0.5s ease; }
  #loader .ask[hidden] { display: none; }
  #loader .ask.done, #loader .ask.done .row { opacity: 0; pointer-events: none; }
  #loader .ask .label { font-size: 20px; font-style: italic; letter-spacing: 0.04em; }
  #loader .ask .row { display: flex; align-items: flex-end; gap: 6px; pointer-events: auto; }
  #loader .ask input { width: 190px; box-sizing: border-box; margin: 0; padding: 4px 2px; border: 0; border-bottom: 1px solid #2e2418; border-radius: 0; outline: none; background: transparent; color: #2e2418; caret-color: #2e2418; font: 20px Georgia, 'Times New Roman', serif; text-align: center; -webkit-appearance: none; appearance: none; user-select: text; -webkit-user-select: text; touch-action: manipulation; }
  #loader .ask button { margin: 0 -4px 0 0; padding: 8px 10px; border: 0; background: transparent; color: #2e2418; font: 20px Georgia, 'Times New Roman', serif; line-height: 1; cursor: pointer; opacity: 0.7; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body.ready #loader { opacity: 0; }
  #rest { position: fixed; left: calc(18px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 26px; height: 26px; pointer-events: none; visibility: hidden; transition: opacity 1.5s ease; filter: var(--halo); }
  body.ready #rest { visibility: visible; }
  #rest .rim { fill: none; stroke: var(--ink); stroke-opacity: 0.7; stroke-width: 1.8; }
  #rest .lit { fill: var(--ink); }
  #stick { position: fixed; right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); width: 150px; height: 150px; display: none; opacity: 0.55; transition: opacity 0.5s ease; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; visibility: hidden; }
  @media (pointer: coarse) and (not (any-pointer: fine)) { #stick { display: block; } }
  body.ready #stick { visibility: visible; }
  #stick.active { opacity: 0.95; transition-duration: 0.15s; }
  #stick svg { width: 100%; height: 100%; display: block; pointer-events: none; overflow: visible; filter: var(--halo); }
  #stick .ring { fill: none; stroke: var(--ink); stroke-width: 2.2; }
  #stick .knob { fill: var(--ink); transition: transform 0.18s ease-out; }
  #stick .knob.held { transition: none; }
  #action { position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 84px; height: 84px; opacity: 0.45; transition: opacity 0.5s ease; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; visibility: hidden; }
  @media (pointer: coarse) and (not (any-pointer: fine)) { #action { right: calc(47px + env(safe-area-inset-right)); bottom: calc(150px + env(safe-area-inset-bottom)); } }
  body.ready #action { visibility: visible; }
  #action.on { cursor: pointer; }
  #action svg { width: 100%; height: 100%; display: block; pointer-events: none; overflow: visible; filter: var(--halo); }
  #action .ring { fill: var(--ink-glow); fill-opacity: 0.29; stroke: var(--ink); stroke-width: 2.2; }
  #action .fill { fill: none; stroke: var(--ink); stroke-width: 2.8; stroke-linecap: round; }
  #action .main, #action .side { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #action .side { stroke-width: 2.4; }
  #action .main *, #action .side * { vector-effect: non-scaling-stroke; }
  #row { position: fixed; left: calc(18px + 26px + 14px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); height: 26px; display: flex; align-items: flex-end; gap: 16px; pointer-events: none; }
  #sound { position: fixed; left: calc(18px + env(safe-area-inset-left)); bottom: calc(18px + 26px + 14px + env(safe-area-inset-bottom)); width: 26px; height: 26px; opacity: 0.5; filter: var(--halo); visibility: hidden; transition: opacity 0.5s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #sound[hidden] { display: none; }
  body.ready #sound { visibility: visible; }
  #sound::before { content: ''; position: absolute; inset: -9px; }
  #sound svg { width: 100%; height: 100%; display: block; pointer-events: none; overflow: visible; }
  #sound .rim { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #needs { display: flex; align-items: flex-end; gap: 10px; }
  #thirst { width: 16px; height: 24px; opacity: 0.5; filter: var(--halo); visibility: hidden; transition: opacity 0.5s ease; }
  body.ready #thirst { visibility: visible; }
  #hunger { width: 24px; height: 24px; opacity: 0.5; filter: var(--halo); visibility: hidden; transition: opacity 0.5s ease; }
  body.ready #hunger { visibility: visible; }
  #hunger .rim { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
  #hunger .lit { fill: var(--ink); fill-opacity: 0.8; }
  #thirst .rim { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
  #thirst .lit { fill: var(--ink); fill-opacity: 0.8; }
  #carry { height: 26px; display: flex; align-items: flex-end; gap: 2px; opacity: 0.5; visibility: hidden; transition: opacity 0.5s ease; }
  body.ready #carry { visibility: visible; }
  #carry svg { opacity: 0.85; height: 24px; width: auto; fill: none; stroke: var(--ink); stroke-width: 2; filter: var(--halo); stroke-linecap: round; stroke-linejoin: round; }
  #carry svg.use { pointer-events: auto; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  @media (hover: hover) { #carry svg.use:hover { opacity: 1; } }
  @media (pointer: coarse) { #carry svg.use { box-sizing: content-box; padding: 8px 5px; margin: -8px -5px; } }
  #carry svg.no { animation: carry-shake 0.35s ease; }
  @keyframes carry-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-3px); } 45% { transform: translateX(3px); } 70% { transform: translateX(-2px); } }
  #dev { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); color: var(--ink); opacity: 0.75; padding: 2px 7px; border-radius: 9px; background: var(--ink-back); font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.02em; white-space: nowrap; pointer-events: none; user-select: none; visibility: hidden; }
  #who { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: calc(18px + env(safe-area-inset-left)); color: var(--ink); opacity: 0.55; font: 15px/1.2 Georgia, 'Times New Roman', serif; letter-spacing: 0.04em; text-shadow: 0 0 4px var(--ink-glow), 0 0 9px var(--ink-glow); white-space: nowrap; pointer-events: none; user-select: none; visibility: hidden; transition: opacity 0.5s ease; }
  body.ready #who { visibility: visible; }
  #wake { position: fixed; left: calc(18px + env(safe-area-inset-left)); right: calc(18px + env(safe-area-inset-right)); top: 40%; text-align: center; color: var(--ink); opacity: 0; font: italic 22px/1.3 Georgia, 'Times New Roman', serif; letter-spacing: 0.04em; text-shadow: 0 0 5px var(--ink-glow), 0 0 12px var(--ink-glow); pointer-events: none; user-select: none; visibility: hidden; }
  body.ready #wake { visibility: visible; }
  #dev[hidden] { display: none; }
  body.ready #dev { visibility: visible; }
</style>
</head>
<body>
<div id="island"></div>
<svg id="rest" viewBox="-1 -1 26 26" aria-hidden="true"><circle class="rim" cx="12" cy="12" r="12"/><path class="lit"/></svg>
<div id="sound" hidden aria-hidden="true"><svg viewBox="0 0 26 26"><path class="rim" d="M3 10H8L14 5V21L8 16H3Z"/><g class="waves"><path class="rim" d="M17.5 9.5Q20 13 17.5 16.5"/><path class="rim" d="M20.5 6.5Q25 13 20.5 19.5"/></g><path class="rim cross" d="M18 9L25 17M25 9L18 17"/></svg></div>
<div id="stick" aria-hidden="true"><svg viewBox="-75 -75 150 150"><circle class="ring" cx="0" cy="0" r="55"/><circle class="knob" cx="0" cy="0" r="6"/></svg></div>
<div id="action" aria-hidden="true"><svg viewBox="-42 -42 84 84"><circle class="ring" cx="0" cy="0" r="30"/><circle class="fill" cx="0" cy="0" r="36" transform="rotate(-90)" stroke-dasharray="226.19" stroke-dashoffset="226.19"/><g class="main"></g><g class="side"></g></svg></div>
<div id="row" aria-hidden="true"><div id="needs"><svg id="thirst" viewBox="0 0 16 24"><clipPath id="thirst-clip"><rect x="0" y="0" width="16" height="24"/></clipPath><path class="lit" clip-path="url(#thirst-clip)" d="M8 1C10 5 14 10 14 15.5A6 6 0 0 1 2 15.5C2 10 6 5 8 1Z"/><path class="rim" d="M8 1C10 5 14 10 14 15.5A6 6 0 0 1 2 15.5C2 10 6 5 8 1Z"/></svg><svg id="hunger" viewBox="0 0 24 24"><clipPath id="hunger-clip"><rect x="0" y="8" width="24" height="14"/></clipPath><path class="lit" clip-path="url(#hunger-clip)" d="M2 8C2 16.5 6.5 22 12 22C17.5 22 22 16.5 22 8Z"/><path class="rim" d="M2 8C2 16.5 6.5 22 12 22C17.5 22 22 16.5 22 8"/><path class="rim" d="M2 8A10 3 0 1 1 22 8A10 3 0 1 1 2 8Z"/></svg></div><div id="carry"></div></div>
<div id="dev" aria-hidden="true"></div>
<div id="who" aria-hidden="true"></div>
<div id="wake" aria-hidden="true"></div>
<div id="loader"><div class="name">DRIFTWOOD</div><div id="ask" class="ask" hidden><div class="label"></div><div class="row"><input type="text" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your name"><button type="button" aria-label="Continue">&rarr;</button></div></div><div class="bar"><div class="fill"></div></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
