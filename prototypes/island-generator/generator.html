    marks.forEach(([x, y, n]) => { g.beginPath(); g.arc(x, y - 22, 14, 0, Math.PI * 2); g.fillStyle = 'rgba(25,22,18,0.8)'; g.fill(); g.lineWidth = 3; g.strokeStyle = '#f7f2e8'; g.stroke(); g.beginPath(); g.moveTo(x, y - 8); g.lineTo(x, y); g.stroke(); g.font = '600 19px "Barlow Semi Condensed", sans-serif'; g.fillStyle = '#f7f2e8'; g.textAlign = 'center'; g.fillText(String(n), x, y - 15); g.textAlign = 'left'; });
  });
}
log('overview');

/* ---------- game-zoom shots ---------- */
const ZOOM = 5.4;
const ONLY = Q.get('only') ? parseInt(Q.get('only')) : 0;
if (MODE === 'all' || MODE === 'pass') shots.forEach((s, i) => {
  if (ONLY && ONLY !== i + 1) return;
  const target = s.target || s.man.clone().add(new THREE.Vector3(0, 0.5, 0));
  placeCam(ZOOM, target, 400);
  // which tiles does this view need?
  const need = TILES.filter(tl => {
    if (tl.hmax < -8.9) return false;
    const cx = tl.x0 + T / 2 - target.x, cz = tl.z0 + T / 2 - target.z, dr = cx * RIGHT.x + cz * RIGHT.z, dc = cx * CAMDIR.x + cz * CAMDIR.z, m = T * 0.71;
    return Math.abs(dr) < ZOOM * 1.6 + m + 2 && dc > -(ZOOM * 2 + 50 + m) && dc < ZOOM * 2 + 30 + m;
  });
  need.forEach(tl => { const g = lowGroups.get(tl); if (g) g.visible = false; });
  const near = buildNear(need, s.man);
  if (s.tier === 0) footprints(near, s.man);
  man.visible = true; man.position.copy(s.man); man.rotation.y = [2.6, -2.2, -2.4, -2.8, -2.0, 2.2, -2.6][i % 7];
  scene.fog = s.fog ? new THREE.Fog(s.fog[0], s.fog[1], s.fog[2]) : null;
  if (s.cool) { hemi.color.set(0xdfe8f0); sun.color.set(0xfff0dc); } else { hemi.color.set(0xe2ebf0); sun.color.set(0xffe6c4); }
  const img = shoot(ZOOM, target, 30);
  const cv = newCanvas('s' + (i + 1)), g = cv.getContext('2d'); background(g); g.drawImage(img, 0, 0); grade(g, OW, OH, { cool: s.cool, beach: s.tier === 0, grey: s.tier === 4, mist: s.tier === 2 ? 0.16 : s.tier === 4 ? 0.06 : 0 });
  LABELS.push(() => { label(g, (i + 1) + ' · ' + s.name, 36, 64, 30); label(g, 'game zoom · seed ' + SEED, 36, 112, 20); });
  // clean up
  scene.remove(near); near.traverse(o => { if (o.isMesh) { o.geometry !== undefined && o.material && o.material.map && o.material.map.dispose(); if (o.geometry && o.parent === null) {} } });
  near.children.forEach(o => { if (o.isMesh && !o.isInstancedMesh) { o.geometry.dispose(); o.material.map && o.material.map.dispose(); o.material.dispose(); } else if (o.isInstancedMesh) o.dispose && o.dispose(); });
  need.forEach(tl => { const g = lowGroups.get(tl); if (g) g.visible = true; });
  scene.fog = null;
  log('shot ' + (i + 1) + ' ghosts ' + (window.__ghosts || 0) + ' manL ' + Lat(s.man.x, s.man.z).toFixed(2) + ' F ' + forestF(tierAt(Lat(s.man.x, s.man.z)), forestB(s.man.x, s.man.z)).toFixed(2)); window.__ghosts = 0;
});

document.fonts.ready.then(() => { LABELS.forEach(f => f()); window.__done = true; });
})();
